version: "3.9"

# 本番用 Docker Compose 設定
# 使用方法: docker-compose -f docker-compose.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tech-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpass}
      POSTGRES_DB: ${POSTGRES_DB:-techdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techuser} -d ${POSTGRES_DB:-techdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tech-memory-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techuser}:${POSTGRES_PASSWORD:-techpass}@db:5432/${POSTGRES_DB:-techdb}
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: tech-memory-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
