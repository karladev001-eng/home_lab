# Tech Stack — tech-memory
# Generated by phase1_tech_stack agent

backend:
  language: "Python"
  runtime: "Python 3.12"
  framework: "FastAPI"
  database:
    primary: "PostgreSQL 16"
    vector_extension: "pgvector 0.7"
    orm: "SQLAlchemy 2.x (async)"
    migration: "Alembic"
  task_queue: "なし（MVP段階：同期処理）"
  infrastructure: "Docker Compose（ローカル）"
  package_manager: "pip (Dockerfile内、venv不使用)"
  selection_reason: |
    仕様書が明示的にPython + FastAPI + PostgreSQL + pgvectorを推奨しており、
    tech_memory.mdのセクション18「推奨技術スタック」に準拠する。
    FastAPIはOpenAPI specの自動生成に対応しており、フロントエンドとの型共有が容易。
    SQLAlchemy async対応でpgvectorの扱いも豊富なエコシステムがある。
  alternatives:
    - "Python + Django REST Framework（大規模向き、MVPには重い）"
    - "Node.js + Hono（JSで統一したい場合）"

ai_extraction:
  llm:
    provider: "Anthropic Claude API（claude-sonnet-4-6 または claude-haiku）"
    method: "structured output (tool_use / response_format)"
    fallback: "OpenAI API互換"
  embedding:
    model: "text-embedding-3-small (OpenAI) または voyage-3-lite (Anthropic)"
    dimensions: 1536
    selection_reason: |
      コスト・性能バランスが良く、pgvectorと直接統合できる。
      将来的にローカルモデル（nomic-embed-text等）への移行も可能。
  web_fetcher:
    primary: "httpx + BeautifulSoup4（一般Webページ）"
    arxiv: "arxiv Python library または arXiv API"
    github: "GitHub REST API（READMEの取得）"
  selection_reason: |
    Claudeをメインとし、structured outputで技術カードをJSON直接生成する。
    embeddingはOpenAI text-embedding-3-smallを基準とする。

search:
  keyword: "PostgreSQL full-text search (tsvector/tsquery)"
  vector: "pgvector cosine similarity"
  hybrid: "keyword + vector のスコアを加重合成"
  reranking: "なし（MVP段階）"
  selection_reason: |
    pgvectorをPostgreSQLに組み込むことで、別途ベクトルDBを不要にする。
    MVPでは追加インフラを最小化する方針に合致する。

frontend:
  web:
    framework: "Next.js 15 (App Router)"
    styling: "Tailwind CSS v3"
    ui_library: "shadcn/ui"
    state: "Zustand"
    api_client: "openapi-fetch（FastAPIのOpenAPI specから型自動生成）"
    package_manager: "pnpm"
    selection_reason: |
      仕様書推奨のNext.js + React + Tailwind CSS構成。
      shadcn/uiでモダンな技術カードUIを素早く構築できる。
      openapi-fetchでバックエンドとの型整合性を保つ。
    alternatives:
      - "Vite + React（Next.js不要な場合）"
      - "SvelteKit（シンプルなSPA向き）"

infrastructure:
  container: "Docker Compose"
  services:
    - name: "api"
      image: "Python 3.12 slim"
      port: 8000
    - name: "db"
      image: "pgvector/pgvector:pg16"
      port: 5432
    - name: "web"
      image: "Node.js 20 alpine"
      port: 3000
  volumes:
    - "postgres_data: DBデータの永続化"
  selection_reason: |
    pip install・venv不使用の指示に従い、すべてDockerで管理する。
    pgvector公式イメージ（pgvector/pgvector:pg16）を使用することでpgvector有効化済みのPostgreSQLが即座に利用できる。
  alternatives:
    - "Railway / Render（クラウドデプロイ時）"
    - "Supabase（pgvector対応マネージドDB）"

shared_core:
  language: "TypeScript（フロントエンド側）/ Python（バックエンド側）"
  api_contract: "OpenAPI 3.1 spec（FastAPI自動生成）"
  type_generation: "openapi-typescript（TS型自動生成）"
  tooling:
    linter_python: "ruff"
    formatter_python: "ruff format"
    linter_ts: "ESLint"
    formatter_ts: "Prettier"
    test_framework_python: "pytest"
    test_framework_ts: "Vitest"
