<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収集 - tech-memory</title>
  <style>
    :root {
      --color-primary-500: #6366f1;
      --color-primary-600: #4f46e5;
      --color-primary-300: #a5b4fc;
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-surface-elevated: #334155;
      --color-border: #334155;
      --color-text-primary: #f1f5f9;
      --color-text-secondary: #94a3b8;
      --color-text-muted: #64748b;
      --color-teal: #14b8a6;
      --font-sans: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --nav-height: 56px;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --radius-full: 9999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background-color: var(--color-bg); color: var(--color-text-primary); min-height: 100vh; }
    nav { height: var(--nav-height); background: var(--color-surface); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; padding: 0 1.5rem; gap: 2rem; position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
    .nav-logo { font-size: 1.125rem; font-weight: 700; color: var(--color-primary-300); text-decoration: none; }
    .nav-links { display: flex; gap: 0.25rem; margin-left: auto; }
    .nav-link { padding: 0.4rem 0.875rem; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; color: var(--color-text-secondary); text-decoration: none; }
    .nav-link.active { color: var(--color-primary-300); background: rgba(99,102,241,0.12); }

    main { margin-top: var(--nav-height); max-width: 680px; margin-left: auto; margin-right: auto; padding: 2.5rem 1.5rem; }

    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .page-subtitle { font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 2rem; }

    /* TABS */
    .input-tabs { display: flex; border-bottom: 1px solid var(--color-border); margin-bottom: 1.75rem; }
    .input-tab { padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500; color: var(--color-text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 150ms ease; }
    .input-tab.active { color: var(--color-primary-300); border-bottom-color: var(--color-primary-500); }

    /* FORM */
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 0.5rem; }
    .form-help { font-size: 0.8125rem; color: var(--color-text-muted); margin-top: 0.375rem; }
    .form-input {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      color: var(--color-text-primary);
      padding: 0.75rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      transition: border-color 150ms ease, box-shadow 150ms ease;
      outline: none;
    }
    .form-input:focus { border-color: var(--color-primary-500); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .form-input::placeholder { color: var(--color-text-muted); }

    /* RADIO DEPTH */
    .depth-options { display: flex; gap: 0.875rem; }
    .depth-option { flex: 1; }
    .depth-option input[type="radio"] { display: none; }
    .depth-card {
      display: block;
      padding: 0.875rem 1rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 150ms ease;
    }
    .depth-option input:checked + .depth-card {
      border-color: var(--color-primary-500);
      background: rgba(99,102,241,0.08);
    }
    .depth-name { font-size: 0.875rem; font-weight: 600; color: var(--color-text-primary); margin-bottom: 0.25rem; }
    .depth-desc { font-size: 0.75rem; color: var(--color-text-muted); }

    /* TAGS INPUT */
    .tags-input-wrap {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 0.625rem 0.875rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      min-height: 48px;
      cursor: text;
      transition: border-color 150ms ease;
    }
    .tags-input-wrap:focus-within { border-color: var(--color-primary-500); }
    .tag-chip { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.2rem 0.625rem; background: rgba(99,102,241,0.15); border-radius: var(--radius-full); font-size: 0.8125rem; color: var(--color-primary-300); }
    .tag-remove { cursor: pointer; color: var(--color-text-muted); font-size: 0.875rem; }
    .tags-input { flex: 1; min-width: 80px; background: transparent; border: none; outline: none; font-family: var(--font-sans); font-size: 0.875rem; color: var(--color-text-primary); }
    .tags-input::placeholder { color: var(--color-text-muted); }

    /* SUBMIT BTN */
    .btn-submit { width: 100%; padding: 0.875rem; background: var(--color-primary-600); color: white; border: none; border-radius: var(--radius-lg); font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 150ms ease; margin-top: 0.5rem; }
    .btn-submit:hover { background: var(--color-primary-500); }

    /* INFO BOX */
    .info-box { margin-top: 1.5rem; padding: 0.875rem 1.125rem; background: rgba(20,184,166,0.07); border: 1px solid rgba(20,184,166,0.2); border-radius: var(--radius-lg); display: flex; gap: 0.75rem; align-items: flex-start; }
    .info-box-icon { color: var(--color-teal); font-size: 1rem; flex-shrink: 0; margin-top: 0.1rem; }
    .info-box-text { font-size: 0.8125rem; color: var(--color-text-secondary); line-height: 1.6; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">tech-memory</a>
    <div class="nav-links">
      <a href="/" class="nav-link">検索</a>
      <a href="/ingest" class="nav-link active">収集</a>
      <a href="/recommend" class="nav-link">推薦</a>
    </div>
  </nav>

  <main>
    <h1 class="page-title">技術情報を収集する</h1>
    <p class="page-subtitle">URL・キーワード・メモから技術カードを自動生成します</p>

    <div class="input-tabs">
      <div class="input-tab active">URL収集</div>
      <div class="input-tab">キーワード収集</div>
      <div class="input-tab">手入力メモ</div>
    </div>

    <form>
      <div class="form-group">
        <label class="form-label" for="url">URL</label>
        <input
          type="url"
          id="url"
          class="form-input"
          placeholder="https://arxiv.org/abs/..."
          value=""
        >
        <p class="form-help">Web記事, arXiv論文, GitHub READMEに対応しています</p>
      </div>

      <div class="form-group">
        <label class="form-label">収集深度</label>
        <div class="depth-options">
          <div class="depth-option">
            <input type="radio" name="depth" id="light" value="light">
            <label for="light" class="depth-card">
              <div class="depth-name">light</div>
              <div class="depth-desc">メタデータのみ</div>
            </label>
          </div>
          <div class="depth-option">
            <input type="radio" name="depth" id="standard" value="standard" checked>
            <label for="standard" class="depth-card">
              <div class="depth-name">standard</div>
              <div class="depth-desc">要約 + 技術抽出</div>
            </label>
          </div>
          <div class="depth-option">
            <input type="radio" name="depth" id="deep" value="deep">
            <label for="deep" class="depth-card">
              <div class="depth-name">deep</div>
              <div class="depth-desc">詳細条件まで抽出</div>
            </label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">タグ（任意）</label>
        <div class="tags-input-wrap">
          <span class="tag-chip">game AI <span class="tag-remove">×</span></span>
          <span class="tag-chip">NPC <span class="tag-remove">×</span></span>
          <input class="tags-input" placeholder="タグを追加... (Enter)">
        </div>
        <p class="form-help">カンマ区切りで最大20個。各タグは50文字以内。</p>
      </div>

      <button type="submit" class="btn-submit">収集開始</button>
    </form>

    <div class="info-box">
      <span class="info-box-icon">ℹ</span>
      <span class="info-box-text">収集処理にはLLM APIによる解析が含まれるため、30秒程度かかる場合があります。処理中はページを離れないでください。</span>
    </div>
  </main>
</body>
</html>
