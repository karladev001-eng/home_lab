<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索トップ - tech-memory</title>
  <style>
    :root {
      --color-primary-500: #6366f1;
      --color-primary-600: #4f46e5;
      --color-primary-300: #a5b4fc;
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-surface-elevated: #334155;
      --color-border: #334155;
      --color-text-primary: #f1f5f9;
      --color-text-secondary: #94a3b8;
      --color-text-muted: #64748b;
      --color-teal: #14b8a6;
      --font-sans: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
      --nav-height: 56px;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --radius-full: 9999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      height: var(--nav-height);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 2rem;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
    }
    .nav-logo {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-primary-300);
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 0.25rem; margin-left: auto; }
    .nav-link {
      padding: 0.4rem 0.875rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: all 150ms ease;
    }
    .nav-link:hover { background: var(--color-surface-elevated); color: var(--color-text-primary); }
    .nav-link.active { color: var(--color-primary-300); background: rgba(99,102,241,0.12); }

    /* MAIN */
    main {
      margin-top: var(--nav-height);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 6rem;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-text-primary);
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .hero-title span { color: var(--color-primary-300); }
    .hero-subtitle {
      font-size: 1rem;
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: 2.5rem;
    }

    /* SEARCH BOX */
    .search-container { width: 100%; max-width: 680px; }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: border-color 250ms ease, box-shadow 250ms ease;
    }
    .search-box:focus-within {
      border-color: var(--color-primary-500);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .search-icon {
      padding: 0 1rem 0 1.25rem;
      color: var(--color-text-muted);
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--color-text-primary);
      padding: 0.875rem 0;
    }
    .search-input::placeholder { color: var(--color-text-muted); }
    .search-btn {
      margin: 0.375rem;
      padding: 0.625rem 1.25rem;
      background: var(--color-primary-600);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease;
      white-space: nowrap;
    }
    .search-btn:hover { background: var(--color-primary-500); }

    /* SEARCH MODE TABS */
    .mode-tabs {
      display: flex;
      gap: 0.375rem;
      margin-top: 0.875rem;
      margin-left: 0.25rem;
    }
    .mode-tab {
      padding: 0.3rem 0.875rem;
      border-radius: var(--radius-full);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      background: transparent;
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: all 150ms ease;
    }
    .mode-tab:hover { border-color: var(--color-primary-500); color: var(--color-primary-300); }
    .mode-tab.active {
      background: rgba(99,102,241,0.15);
      border-color: var(--color-primary-500);
      color: var(--color-primary-300);
    }

    /* EXAMPLES */
    .examples-section { margin-top: 3rem; width: 100%; max-width: 680px; }
    .examples-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 1rem;
    }
    .examples-group { margin-bottom: 1.25rem; }
    .examples-group-label {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      margin-bottom: 0.5rem;
    }
    .examples-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .example-tag {
      padding: 0.35rem 0.875rem;
      border-radius: var(--radius-full);
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: all 150ms ease;
    }
    .example-tag:hover {
      background: var(--color-surface-elevated);
      color: var(--color-text-primary);
      border-color: var(--color-primary-500);
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">tech-memory</a>
    <div class="nav-links">
      <a href="/" class="nav-link active">検索</a>
      <a href="/ingest" class="nav-link">収集</a>
      <a href="/recommend" class="nav-link">推薦</a>
    </div>
  </nav>

  <main>
    <h1 class="hero-title"><span>tech</span>-memory</h1>
    <p class="hero-subtitle">技術・アルゴリズム・設計パターンを課題から検索する</p>

    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          class="search-input"
          placeholder="技術名・課題・分野を入力 ..."
          value=""
        >
        <button class="search-btn">検索</button>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab">技術名</button>
        <button class="mode-tab active">課題</button>
        <button class="mode-tab">分野</button>
        <button class="mode-tab">比較</button>
      </div>
    </div>

    <div class="examples-section">
      <div class="examples-title">検索例</div>
      <div class="examples-group">
        <div class="examples-group-label">課題から探す</div>
        <div class="examples-tags">
          <button class="example-tag">少ない試行回数で良い候補を見つけたい</button>
          <button class="example-tag">NPCの行動制御をしたい</button>
          <button class="example-tag">大量イベントをリアルタイム処理したい</button>
        </div>
      </div>
      <div class="examples-group">
        <div class="examples-group-label">技術名で探す</div>
        <div class="examples-tags">
          <button class="example-tag">RAG</button>
          <button class="example-tag">Behavior Tree</button>
          <button class="example-tag">ECS</button>
          <button class="example-tag">Bayesian Optimization</button>
          <button class="example-tag">CQRS</button>
        </div>
      </div>
      <div class="examples-group">
        <div class="examples-group-label">分野で探す</div>
        <div class="examples-tags">
          <button class="example-tag">ゲームAI</button>
          <button class="example-tag">LLMシステム</button>
          <button class="example-tag">バックエンド設計</button>
          <button class="example-tag">ロボティクス</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
